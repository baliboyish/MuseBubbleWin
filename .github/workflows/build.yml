name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build
        shell: pwsh
        run: ./build.ps1
      - name: Run native rendering checks
        shell: pwsh
        run: ./tests/run.ps1
      - name: Check page theme
        shell: pwsh
        run: node tests/theme-checks.cjs
      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: MuseBubbleWin-windows-x64
          path: |
            artifacts/Release/
            !artifacts/Release/ThemeChecks.exe
            !artifacts/Release/OpaquePaintCheck.exe
            !artifacts/Release/.debug/**
          if-no-files-found: error
